# ============================================================
#  Universal Landscaping — Netlify Configuration
# ============================================================
#  This file tells Netlify how to serve your site and where
#  the serverless functions live.
# ============================================================

[build]
  # Everything at the site root is served as-is (static site)
  publish = "."
  # Netlify functions live in this folder
  functions = "netlify/functions"

# Functions have no dependencies — no bundler needed.
# (Do not add node_bundler here: manual drag-and-drop deploys
#  don't run a build, so bundler configs prevent registration.)

# Cache static assets aggressively — makes the site load fast
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Security headers — makes the site safer
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# ============================================================
#  REDIRECTS — added for SEO / URL consistency
# ============================================================
#  Canonical URL form: EXTENSIONLESS.
#  NOTE: no "force" on the .html rules. Netlify serves pretty
#  URLs from the .html files internally; forcing a redirect on
#  .html would create an infinite loop (/services -> serve
#  services.html -> force redirect -> /services ...). Without
#  force, Netlify serves /services normally and only redirects
#  when a visitor explicitly requests the .html or old URL.
# ============================================================

# ---------- 1. Old .html URLs -> extensionless canonical ----------
